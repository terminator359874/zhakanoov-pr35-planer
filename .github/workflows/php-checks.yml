name: PHP Checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    continue-on-error: true # Игнорировать ошибки в этой работе
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Check PHP syntax
        continue-on-error: true # Игнорировать ошибку конкретно здесь
        run: |
          find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

  phpcs:
    name: Code Style Check
    runs-on: ubuntu-latest
    continue-on-error: true # Игнорировать ошибки стиля
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP with PHPCS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: phpcs
      - name: Run PHPCS
        run: phpcs . || true # Добавление || true в конце команды
